name: Repo Policy Action (report-all full scan)

on:
  push:
    branches: [test/repo-policy-action-report-all]
  workflow_dispatch:

# NOTE: this repo's Actions policy is allowed_actions=selected, which blocks
# third-party actions like sshedge71/repo-policy-action. We therefore run the
# action's code directly using only github-owned actions (checkout,
# setup-python), which are permitted by the allowlist.

jobs:
  policy:
    name: Full scan (report all offenders)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixture repo (scan target)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout repo-policy-action (pr-24 fix)
        uses: actions/checkout@v4
        with:
          repository: sshedge71/repo-policy-action
          ref: pr-24
          path: action

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libmagic + action dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y libmagic1
          python -m pip install --upgrade pip
          pip install -r action/requirements.txt

      - name: Run repo-policy-action (full scan, report all offenders)
        run: |
          PYTHONPATH=action/src python action/src/main.py \
            --repo-path "$GITHUB_WORKSPACE/repo" \
            --no-fail-on-error --no-fail-on-warning
