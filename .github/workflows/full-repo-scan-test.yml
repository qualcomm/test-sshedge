name: Full-Repo Scan Test - sshedge

# There is no enable-full-repo-scan input any more: the full-repo scan was folded
# into reusable-copyright-license-check.yml, which routes by event -- push runs the
# full-repo scan, pull_request runs the diff scan. So enable-copyright-license-check
# is what turns it on. Passing the old input made the run fail at startup with an
# unrecognized-input error before any job started.

on:
  push:
  workflow_dispatch:

jobs:
  full-scan:
    name: Run Full-Repo Copyright and License Scan
    uses: qualcomm/qcom-reusable-workflows/.github/workflows/reusable-qcom-preflight-checks-orchestrator.yml@test_copyright_license_action
    with:
      enable-semgrep-scan: false
      enable-dependency-review: false
      enable-repolinter-check: false
      enable-copyright-license-check: true
      enable-commit-email-check: false
      enable-commit-msg-check: false
      enable-armor-checkers: false
    permissions:
      contents: read
      security-events: write
