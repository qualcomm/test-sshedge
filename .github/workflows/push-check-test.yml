name: Push Copyright License Check Test - sshedge

# Exercises the copyright/license diff check on PUSH events (not just PRs) via
# the reusable orchestrator on the test_copyright_license_action branch. The
# pull_request trigger is kept so push-vs-PR parity can be cross-checked from
# the same branch.
on:
  push:
    branches: [push-check-validation]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Run Copyright License Check (push)
    uses: qualcomm/qcom-reusable-workflows/.github/workflows/reusable-qcom-preflight-checks-orchestrator.yml@test_copyright_license_action
    with:
      enable-semgrep-scan: false
      enable-dependency-review: false
      enable-repolinter-check: false
      enable-copyright-license-check: true
      enable-commit-email-check: false
      enable-commit-msg-check: false
      enable-armor-checkers: false
      enable-full-repo-scan: false
    permissions:
      contents: read
