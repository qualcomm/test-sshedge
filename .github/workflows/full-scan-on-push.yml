name: Full-Repo Scan on Push - sshedge

# On a direct push to this branch, scan the WHOLE repository (full_scan.py,
# Python 3.12). PR/diff scanning is handled by diff-scan-on-pr.yml.
on:
  push:
    branches: [push-fullscan-validation]
  workflow_dispatch:

jobs:
  full-scan:
    name: Run Full-Repo Copyright and License Scan (push)
    uses: qualcomm/qcom-reusable-workflows/.github/workflows/reusable-qcom-preflight-checks-orchestrator.yml@test_copyright_license_action
    with:
      enable-semgrep-scan: false
      enable-dependency-review: false
      enable-repolinter-check: false
      enable-copyright-license-check: false
      enable-commit-email-check: false
      enable-commit-msg-check: false
      enable-armor-checkers: false
      enable-full-repo-scan: true
    permissions:
      contents: read
      # semgrep job declares security-events: write; GitHub validates every
      # called job's permissions at startup, before the enable-* if: conditions.
      security-events: write
